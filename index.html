<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>濟州繪本行程</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
/* 版面：固定頂端選單 → 首頁插圖卡 → 標題與今日日期 → 日期分頁 → 地圖卡 → 行程卡片。
   和紙白底、3px 墨線框、大圓角、平塗，單一淺色風格（不做深色模式）。 */
:root{
  --paper:#FFFCF6; --ink:#3E3A39;
  --coral:#F2A497; --yellow:#F6D27A; --aqua:#A8D3E6; --green:#B9DAA5;
  --line:3px; --r-xl:30px; --r-lg:24px; --r-md:18px; --r-pill:999px;
  --font:'Huninn','jf-openhuninn-2.0','PingFang TC','Hiragino Sans CNS','Noto Sans TC','Microsoft JhengHei',sans-serif;
  --nav-h:56px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--nav-h) + env(safe-area-inset-top,0px) + 12px)}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--font);font-size:16px;line-height:1.65;
  -webkit-text-size-adjust:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(var(--nav-h) + 20px) 40px;
}
h1,h2,h3,p,ol{margin:0}
h1,h2,h3,strong,b{font-weight:400}
a,button{color:inherit}
a:focus-visible,button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.wrap{max-width:600px;margin:0 auto}

/* ---------- 頂端選單 ---------- */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:30;
  background:var(--paper);border-bottom:var(--line) solid var(--ink);
  padding-top:env(safe-area-inset-top,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.nav-in{height:var(--nav-h);max-width:600px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;font-size:19px;letter-spacing:.06em}
.brand svg{width:30px;height:30px;flex:none}
.nav-links{display:flex;gap:8px}
.nav-links a{
  display:inline-flex;align-items:center;min-height:38px;padding:0 15px;
  border:var(--line) solid var(--ink);border-radius:var(--r-pill);
  background:var(--paper);text-decoration:none;font-size:15px;
  transition:transform .25s cubic-bezier(.34,1.56,.64,1),background-color .2s;
}
.nav-links a:hover{transform:translateY(-2px)}
.nav-links a:active{transform:scale(.94)}
.nav-links a[aria-current="true"]{background:var(--yellow)}

/* ---------- 首頁 ---------- */
.hero{display:grid;gap:18px}
.art-card{border:var(--line) solid var(--ink);border-radius:var(--r-xl);overflow:hidden;background:var(--paper)}
.art{display:block;width:100%;height:auto}
.hero-text{display:grid;gap:6px;text-align:center;justify-items:center}
.eyebrow{font-size:14px;letter-spacing:.08em}
h1{font-size:clamp(36px,11vw,50px);line-height:1.15;letter-spacing:.05em;text-wrap:balance}
.lead{font-size:15px;max-width:30ch;text-wrap:balance}
.today{display:flex;align-items:center;gap:16px;padding:14px 16px;border:var(--line) solid var(--ink);border-radius:var(--r-xl);background:var(--yellow)}
.cal{flex:none;width:80px;border:var(--line) solid var(--ink);border-radius:var(--r-md);background:var(--paper);overflow:hidden;text-align:center}
.cal-m{display:block;background:var(--coral);border-bottom:var(--line) solid var(--ink);font-size:14px;line-height:1.75}
.cal-d{display:block;font-size:42px;line-height:1.15;padding:3px 0 5px;font-variant-numeric:tabular-nums}
.today-text{display:grid;gap:1px;min-width:0}
.today-k{font-size:13px;letter-spacing:.08em}
.today-w{font-size:28px;line-height:1.2}
.today-c{font-size:14px;line-height:1.5}
.cta{
  justify-self:center;display:inline-flex;align-items:center;gap:8px;min-height:50px;padding:0 26px;
  border:var(--line) solid var(--ink);border-radius:var(--r-pill);background:var(--coral);
  text-decoration:none;font-size:17px;letter-spacing:.05em;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);
}
.cta svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.cta:hover{transform:translateY(-3px) scale(1.04)}
.cta:active{transform:scale(.95)}

/* ---------- 每日行程 ---------- */
.plan{margin-top:48px}
.sec-head{display:grid;gap:2px;margin-bottom:14px}
h2{font-size:28px;line-height:1.3;letter-spacing:.05em}
.sec-head p{font-size:14px}
.ico,.day-ico svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;padding-bottom:5px}
.tab{
  position:relative;display:grid;justify-items:center;padding:8px 2px 7px;
  border:var(--line) solid var(--ink);border-radius:var(--r-md);background:var(--paper);
  font:inherit;line-height:1.25;cursor:pointer;-webkit-tap-highlight-color:transparent;
  transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .2s;
}
.tab .ico{width:22px;height:22px;margin-bottom:2px}
.tab .d{font-size:15px;font-variant-numeric:tabular-nums}
.tab .w{font-size:12px}
.tab[aria-selected="true"]{background:var(--c);transform:translateY(-3px);box-shadow:0 4px 0 var(--ink)}
.tab.today::after{
  content:"今";position:absolute;top:-9px;right:-5px;width:20px;height:20px;display:grid;place-items:center;
  border:2px solid var(--ink);border-radius:50%;background:var(--coral);font-size:11px;line-height:1;
}
.tab.pop{animation:tabPop .55s cubic-bezier(.34,1.56,.64,1)}
@keyframes tabPop{0%{transform:scale(.8)}50%{transform:translateY(-6px) scale(1.14) rotate(-2deg)}100%{transform:translateY(-3px) scale(1)}}

.day-head{display:flex;align-items:center;gap:14px;margin:20px 0 14px}
.day-ico{flex:none;width:58px;height:58px;display:grid;place-items:center;border:var(--line) solid var(--ink);border-radius:50%;background:var(--c)}
.day-ico svg{width:32px;height:32px}
.day-txt{min-width:0;display:grid;gap:2px}
.day-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:14px}
.day-chip{padding:0 12px;border:2px solid var(--ink);border-radius:var(--r-pill);background:var(--c);line-height:1.6}
.day-title{font-size:23px;line-height:1.3;text-wrap:balance}

.map-card{
  position:relative;aspect-ratio:5/4;overflow:hidden;
  border:var(--line) solid var(--ink);border-radius:var(--r-xl);background:var(--aqua);
  scroll-margin-top:calc(var(--nav-h) + env(safe-area-inset-top,0px) + 12px);
}
.map{display:block;width:100%;height:100%;font-family:var(--font)}
#island{fill:#B9DAA5;stroke:#3E3A39;stroke-width:3;stroke-linejoin:round;vector-effect:non-scaling-stroke}
#overlay{transition:opacity .15s}
#overlay.hide{opacity:0}
.wave{fill:none;stroke:#FFFCF6;stroke-width:2.5;stroke-linecap:round;animation:wob 3s ease-in-out infinite alternate}
@keyframes wob{to{transform:translateY(-2px)}}
.lab{font-size:12px;fill:#3E3A39;text-anchor:middle;paint-order:stroke;stroke:#FFFCF6;stroke-width:3px;stroke-linejoin:round;opacity:.85}
.mt path{fill:#FFFCF6;stroke:#3E3A39;stroke-width:2.5;stroke-linejoin:round}
.rt{fill:none;stroke:#3E3A39;stroke-linecap:round;stroke-dasharray:var(--len);animation:draw .28s ease-out backwards;animation-delay:var(--d)}
@keyframes draw{from{stroke-dashoffset:var(--len)}}
.ah{fill:none;stroke:#3E3A39;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;animation:fade .15s ease-out backwards;animation-delay:var(--d)}
@keyframes fade{from{opacity:0}}
.pin{cursor:pointer}
.pin .pop{transform-box:fill-box;transform-origin:center;animation:pinPop .5s cubic-bezier(.34,1.56,.64,1) backwards;animation-delay:var(--d)}
@keyframes pinPop{from{transform:scale(0)}}
.pin .dot{stroke:#3E3A39;stroke-width:2.5}
.pin text{font-size:14px;text-anchor:middle;fill:#3E3A39;pointer-events:none}
.pin .ring{display:none;fill:none;stroke:#3E3A39;stroke-width:2.5;stroke-dasharray:3 4}
.pin.on .ring{display:block}
.pin.on .pop{animation:hop .55s cubic-bezier(.34,1.56,.64,1)}
@keyframes hop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1.12)}}
.pin .bub{display:none;transform-box:fill-box;transform-origin:50% 100%}
.pin.on .bub{display:block;animation:bubIn .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes bubIn{from{transform:scale(.5);opacity:0}}
.bub rect{fill:#FFFCF6;stroke:#3E3A39;stroke-width:2.5}
.bub text{font-size:13px;text-anchor:middle}
.legend{margin:10px 4px 0;font-size:13px;line-height:1.6}
.mline{fill:none;stroke:#3E3A39;opacity:.7;animation:fade .3s ease-out backwards;animation-delay:var(--d)}
.mdot{fill:#FFFCF6;stroke:#3E3A39;animation:fade .3s ease-out backwards;animation-delay:var(--d)}
.cat.pick{background:var(--paper);border-style:dashed}

.stops{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:10px}
.stop{animation:rise .5s cubic-bezier(.34,1.56,.64,1) backwards;animation-delay:calc(var(--i) * 55ms)}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.94)}}
.pop-in{animation:popIn .55s cubic-bezier(.34,1.56,.64,1) backwards}
@keyframes popIn{from{opacity:0;transform:scale(.9)}}
.stop-in{
  width:100%;display:grid;grid-template-columns:42px minmax(0,1fr);gap:12px;align-items:start;
  padding:12px 14px;border:var(--line) solid var(--ink);border-radius:var(--r-lg);background:var(--paper);
  text-align:left;font:inherit;color:inherit;
}
button.stop-in{cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .2s cubic-bezier(.34,1.56,.64,1),background-color .15s}
button.stop-in:active{transform:scale(.97)}
.stop.on .stop-in{background:var(--yellow)}
.badge{width:42px;height:42px;display:grid;place-items:center;border:var(--line) solid var(--ink);border-radius:50%;background:var(--bg);font-size:18px;line-height:1;font-variant-numeric:tabular-nums}
.badge .hs{width:30px;height:30px;display:block}
.badge.nomap{border-style:dashed;background:var(--paper)}
.body{display:block;min-width:0}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;font-size:13px}
.time{font-variant-numeric:tabular-nums}
.cat{padding:0 9px;border:2px solid var(--ink);border-radius:var(--r-pill);background:var(--bg);font-size:12px;line-height:1.55}
.name{display:block;margin-top:3px;font-size:19px;line-height:1.35;overflow-wrap:anywhere}
.note{display:block;margin-top:2px;font-size:14px;line-height:1.55}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.tag{padding:0 11px;border:2px solid var(--ink);border-radius:var(--r-pill);background:var(--paper);font-size:13px;line-height:1.7}

.foot{margin-top:30px;display:grid;gap:4px;padding:14px 18px;border:var(--line) solid var(--ink);border-radius:var(--r-lg);background:var(--green);font-size:14px;line-height:1.6}

/* ---------- 首頁插圖動畫 ---------- */
.art *{transform-box:fill-box}
.sun-rays{transform-origin:center;animation:spin 28s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cloud-a{animation:driftA 7s ease-in-out infinite alternate}
.cloud-b{animation:driftB 9s ease-in-out infinite alternate}
@keyframes driftA{to{transform:translateX(-16px)}}
@keyframes driftB{to{transform:translateX(18px)}}
.plane{animation:fly 4s ease-in-out infinite alternate}
@keyframes fly{from{transform:translate(0,2px) rotate(-1deg)}to{transform:translate(16px,-6px) rotate(1.5deg)}}
.waves{animation:sway 4.5s ease-in-out infinite alternate}
@keyframes sway{to{transform:translateX(-14px)}}
.grandpa{transform-origin:50% 100%;animation:nod 3.8s ease-in-out infinite alternate}
.tree{transform-origin:50% 100%;animation:nod 4.6s ease-in-out infinite alternate-reverse}
@keyframes nod{from{transform:rotate(-1.8deg)}to{transform:rotate(1.8deg)}}
.car{animation:drive 14s linear infinite}
@keyframes drive{from{transform:translateX(-200px)}to{transform:translateX(260px)}}
.car-body{animation:bob .5s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-1.5px)}}
.wheel{transform-origin:center;animation:spin .7s linear infinite}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

</svg>

<nav class="nav" aria-label="主選單">
  <div class="nav-in">
    <a class="brand" href="#home" aria-label="回到首頁">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="18" r="11" fill="#F6D27A" stroke="#3E3A39" stroke-width="2.6"/><path d="M16 8Q16 2 24 3Q23 9 16 8Z" fill="#B9DAA5" stroke="#3E3A39" stroke-width="2.4" stroke-linejoin="round"/></svg>
      <span>濟州行</span>
    </a>
    <div class="nav-links">
      <a href="#home" aria-current="true">首頁</a>
      <a href="#plan" aria-current="false">每日行程</a>
    </div>
  </div>
</nav>

  <header id="home" class="hero">
    <div class="art-card">
      <svg class="art" viewBox="0 0 360 280" role="img" aria-label="繪本風插圖：漢拿山、城山日出峰、石爺爺、橘子樹、小車與飛機">

    var bend=Math.min(d*0.16,28*k);
    var qx=(a.x+b.x)/2+uy*bend,qy=(a.y+b.y)/2-ux*bend;
    var ang=Math.atan2(ey-qy,ex-qx)*180/Math.PI,d0=i*260;
    rh+='<path class="rt" d="M'+f(sx)+' '+f(sy)+'Q'+f(qx)+' '+f(qy)+' '+f(ex)+' '+f(ey)+'" stroke-width="'+(3*k).toFixed(2)+'" style="--d:'+(d0+140)+'ms"/>';
    rh+='<g transform="translate('+f(ex)+' '+f(ey)+') rotate('+ang.toFixed(1)+') scale('+ks+')"><path class="ah" d="M-8-6.5L0 0L-8 6.5" style="--d:'+(d0+380)+'ms"/></g>';
  }
  var gh='';
  pts.forEach(function(p,i){
    (p.s.dots||[]).forEach(function(d){
      var dx=X(d[1]),dy=Y(d[0]);
      gh+='<line class="mline" x1="'+f(p.x)+'" y1="'+f(p.y)+'" x2="'+f(dx)+'" y2="'+f(dy)+'" stroke-width="'+(2*k).toFixed(2)+'" stroke-dasharray="'+(4*k).toFixed(1)+' '+(4*k).toFixed(1)+'" style="--d:'+(i*260)+'ms"/>'+
        '<circle class="mdot" cx="'+f(dx)+'" cy="'+f(dy)+'" r="'+(5.5*k).toFixed(2)+'" stroke-width="'+(2.2*k).toFixed(2)+'" style="--d:'+(i*260)+'ms"/>';
    });
  });
  routesG.innerHTML=gh+rh;
  routesG.querySelectorAll('.rt').forEach(function(p){p.style.setProperty('--len',Math.ceil(p.getTotalLength())+2)});

  pinsG.innerHTML=pts.map(function(p,i){
    var s=p.s,col=CAT[s.cat][1];
    return '<g class="pin" data-n="'+s.id+'" transform="translate('+f(p.x)+' '+f(p.y)+') scale('+ks+')" aria-hidden="true">'+
      '<circle class="ring" r="19"/>'+
      '<g class="pop" style="--d:'+(i*260)+'ms"><circle class="dot" r="12.5" fill="'+col+'"/>'+(s.home?'<use href="#house" x="-13" y="-13" width="26" height="26"/>':'<text dy=".35em">'+s.n+'</text>')+'</g>'+
      '<circle r="20" fill="transparent"/>'+bubble(s,p,k,v,L.W)+'</g>';
  }).join('');
  applySel();
}

function applySel(){
  var picked=null;
  document.querySelectorAll('.stop.has').forEach(function(li){
    var on=sel!==null&&+li.dataset.n===sel;
    li.classList.toggle('on',on);
    li.querySelector('button').setAttribute('aria-pressed',on?'true':'false');
  });
  pinsG.querySelectorAll('.pin').forEach(function(g){
    var on=sel!==null&&+g.dataset.n===sel;
    g.classList.toggle('on',on);
    if(on)picked=g;
  });
  if(picked)pinsG.appendChild(picked);
}
function select(n,fromList){
  sel=(sel===n)?null:n;
  applySel();
  if(sel!==null&&fromList){
    mapCard.scrollIntoView({behavior:RM.matches?'auto':'smooth',block:'nearest'});
  }
}

function animateVB(to,done,tk){
  if(RM.matches){setVB(to);done();return}
  cancelAnimationFrame(raf);
  var from={x:vb.x,y:vb.y,w:vb.w,h:vb.h},t0=performance.now(),D=520;
  function step(now){
    if(tk!==token)return;
    var t=Math.min(1,(now-t0)/D),e=1-Math.pow(1-t,3);
    setVB({x:from.x+(to.x-from.x)*e,y:from.y+(to.y-from.y)*e,w:from.w+(to.w-from.w)*e,h:from.h+(to.h-from.h)*e});
    if(t<1)raf=requestAnimationFrame(step);else done();
  }
  raf=requestAnimationFrame(step);
}
function drawMap(di,instant){
  var tk=++token,L=layoutDay(di);
  function go(){if(tk!==token)return;overlay.classList.remove('hide');renderOverlay(L)}
  if(instant||RM.matches){cancelAnimationFrame(raf);setVB(L.v);go();return}
  overlay.classList.add('hide');
  animateVB(L.v,go,tk);
}

/* ---------- 分頁與清單 ---------- */
var tabsEl=$('#tabs'),stopsEl=$('#stops');
tabsEl.innerHTML=DAYS.map(function(D,i){
  return '<button type="button" role="tab" class="tab'+(i===todayIdx?' today':'')+'" id="tab'+i+'" data-i="'+i+'" aria-selected="false" aria-controls="panel" tabindex="-1" style="--c:'+D.color+'">'+
    '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-'+D.icon+'"/></svg>'+
    '<span class="d">'+D.m+'/'+D.d+'</span><span class="w">週'+D.w+'</span></button>';
}).join('');

function restart(el,cls){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls)}

function renderPanel(di,bounce){
  var D=DAYS[di];
  $('#dayHead').innerHTML='<span class="day-ico" style="--c:'+D.color+'"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-'+D.icon+'"/></svg></span>'+
    '<div class="day-txt"><p class="day-meta"><span class="day-chip" style="--c:'+D.color+'">第 '+(di+1)+' 天</span><span>2026/'+D.m+'/'+D.d+'（'+D.w+'）</span></p><h3 class="day-title">'+D.title+'</h3></div>';
  stopsEl.innerHTML=D.stops.map(function(s,i){
    var c=CAT[s.cat],has=!!s.ll;
    var badge=has?'<span class="badge" style="--bg:'+c[1]+'">'+(s.home?'<svg class="hs" viewBox="-13 -13 26 26" role="img" aria-label="住宿"><use href="#house" x="-13" y="-13" width="26" height="26"/></svg>':s.n)+'</span>':'<span class="badge nomap" role="img" aria-label="未標示於地圖">·</span>';
    var tl=s.opts?s.opts.map(function(o){return o.name}):s.tags;
    var tags=tl?'<span class="tags">'+tl.map(function(t){return '<span class="tag">'+t+'</span>'}).join('')+'</span>':'';
    var pick=s.opts?'<span class="cat pick">'+['','','二','三','四'][s.opts.length]+'選一</span>':'';
    var inner=badge+'<span class="body"><span class="meta">'+(s.t?'<span class="time">'+s.t+'</span>':'')+'<span class="cat" style="--bg:'+c[1]+'">'+c[0]+'</span>'+pick+'</span>'+
      '<span class="name">'+s.name+'</span>'+(s.note?'<span class="note">'+s.note+'</span>':'')+tags+'</span>';
    return '<li class="stop'+(has?' has':'')+'" style="--i:'+i+'"'+(has?' data-n="'+s.id+'"':'')+'>'+
      (has?'<button type="button" class="stop-in" aria-pressed="false">'+inner+'</button>':'<div class="stop-in">'+inner+'</div>')+'</li>';
  }).join('');
  if(bounce){restart($('#dayHead'),'pop-in');restart(mapCard,'pop-in')}
}

function showDay(di,opts){
  opts=opts||{};
  cur=di;sel=null;
  document.querySelectorAll('.tab').forEach(function(b,i){
    var on=i===di;
    b.setAttribute('aria-selected',on?'true':'false');
    b.tabIndex=on?0:-1;
    b.classList.remove('pop');
  });
  var tb=$('#tab'+di);
  $('#panel').setAttribute('aria-labelledby','tab'+di);
  if(opts.bounce)restart(tb,'pop');
  renderPanel(di,opts.bounce);
  drawMap(di,!!opts.instant);
}

tabsEl.addEventListener('click',function(e){
  var b=e.target.closest('.tab');
  if(b&&+b.dataset.i!==cur)showDay(+b.dataset.i,{bounce:true});
});
tabsEl.addEventListener('keydown',function(e){
  var d=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0;
  if(!d)return;
  e.preventDefault();
  var n=(cur+d+DAYS.length)%DAYS.length;
  showDay(n,{bounce:true});
  $('#tab'+n).focus();
});
stopsEl.addEventListener('click',function(e){
  var b=e.target.closest('button.stop-in');
  if(b)select(+b.parentNode.dataset.n,true);
});
pinsG.addEventListener('click',function(e){
  var g=e.target.closest('.pin');
  if(g)select(+g.dataset.n,false);
});

var lastW=0,rto=0;
if(window.ResizeObserver){
  new ResizeObserver(function(){
    var w=mapCard.clientWidth;
    if(Math.abs(w-lastW)<2)return;
    lastW=w;
    clearTimeout(rto);
    rto=setTimeout(function(){drawMap(cur,true)},120);
  }).observe(mapCard);
}

/* ---------- 頂端選單高亮 ---------- */
var navLinks=document.querySelectorAll('.nav-links a'),ticking=false;
function onScroll(){
  if(ticking)return;
  ticking=true;
  requestAnimationFrame(function(){
    ticking=false;
    var planOn=$('#plan').getBoundingClientRect().top<window.innerHeight*0.45;
    navLinks[0].setAttribute('aria-current',planOn?'false':'true');
    navLinks[1].setAttribute('aria-current',planOn?'true':'false');
  });
}
window.addEventListener('scroll',onScroll,{passive:true});

showDay(todayIdx>=0?todayIdx:0,{instant:true,bounce:false});
onScroll();
})();
</script>

</body></html>
